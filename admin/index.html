<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>后台 · CSLB 备考</title>
<link rel="stylesheet" href="../assets/site.css">
<style>
.ad{max-width:1000px;margin:0 auto;padding:24px 16px 80px}
.ad header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ad header h1{margin:0;margin-inline-end:auto;font:600 24px/1.2 var(--serif)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{border:1px solid var(--rule);padding:14px}.card b{display:block;font:600 28px/1.1 var(--serif)}.card span{font-size:13px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--rule);margin:8px 0 4px}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:16px}
.chart i{flex:1;max-width:28px;background:var(--red);position:relative}.chart i.z{background:var(--rule);height:2px!important}
.chart i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font:12px var(--sans);background:var(--ink);color:var(--bg);padding:2px 6px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0 12px}
.item{border:1px solid var(--rule);padding:14px;margin-bottom:12px}
.item.done{opacity:.65}
.item .top{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:6px}
.badge{background:var(--panel);color:var(--ink);padding:1px 8px}.badge.q{background:var(--red);color:#fff}
.msg{white-space:pre-wrap;margin:6px 0}
.qref{background:var(--panel);padding:10px;font-size:14px;margin:8px 0}
.item textarea{width:100%;font:14px/1.4 var(--sans);padding:6px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);box-sizing:border-box}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts .btn{min-height:36px;padding:6px 12px;font-size:14px}
[hidden]{display:none!important}
#login{max-width:360px;margin:12vh auto;display:grid;gap:12px}
#login input{font:16px var(--sans);padding:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}

.tabs{margin:0 0 20px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 32px;margin:20px 0}
.grid h3{margin:0 0 6px;font-size:16px}
.kv{width:100%;border-collapse:collapse;font-size:14px}.kv td{padding:4px 0;border-bottom:1px solid var(--rule)}.kv td.n{text-align:right;width:56px}
.kv .bar{height:6px;background:var(--red);opacity:.35;margin-top:2px}
.chart i b{position:absolute;left:0;right:0;border-top:2px solid var(--ink)}
.card small{display:block;font-size:13px;color:var(--mute);margin-top:2px}
</style>
</head>
<body>
<div class="ad">
  <form id="login" hidden>
    <h1 style="font:600 24px var(--serif);margin:0">CSLB 备考 · 后台</h1>
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password" required>
    <button class="btn pri">登录</button>
    <p class="small" id="lmsg" role="status"></p>
  </form>
  <main id="app" hidden>
    <header><h1>CSLB 备考 · 后台</h1><a class="btn" href="../">回到网站</a><button class="btn" id="reload">刷新</button><button class="btn" id="logout">退出</button></header>
    <div class="filters tabs" role="tablist"><button class="chip" data-tab="traffic" role="tab">流量</button><button class="chip" data-tab="fb" role="tab">意见 <small id="fbcount"></small></button></div>
    <section id="traffic">
      <div class="cards" id="cards"></div>
      <h3>最近 30 天</h3>
      <p class="small">红柱为浏览量，深色线为访客数（美国中部时间）。鼠标移到柱子上看具体数字。</p>
      <div class="chart" id="chart"></div><div class="axis" id="axis"></div>
      <div class="grid" id="tables"></div>
      <p class="small">来源、地区、设备、语言、时段为最近 30 天。访客数按“同一天、同一网络、同一浏览器”去重，只存不可逆的当日哈希，不存 IP，无法跨天追踪个人。来源、地区、设备等明细从 2026-11-23 开始记录。</p>
    </section>
    <section id="fb" hidden>
      <div class="filters" id="filters"></div>
      <div id="list"></div>
    </section>
  </main>
</div>
<script src="../content/questions.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=Object.fromEntries((window.QUESTIONS||[]).map(q=>[q.id,q]));
const KIND={question:'题目有误',site:'网站问题',idea:'建议'},ST={new:'待处理',done:'已处理',ignored:'忽略'},LANG={zh:'中文',en:'英文',es:'西语'};
const PG={index:'首页',practice:'章节练习',exam:'模拟考试',notes:'知识点讲义',guide:'申请指南'};
let pw=sessionStorage.getItem('cslb-admin')||'',data=null,filter='new';
async function api(method,body){
  const r=await fetch('/api/admin',{method,headers:{'x-admin-password':pw,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){sessionStorage.removeItem('cslb-admin');showLogin('密码不对');throw 0}
  if(!r.ok)throw new Error('server');return r.json();
}
function showLogin(m){$('#app').hidden=true;$('#login').hidden=false;$('#lmsg').textContent=m||'';$('#pw').focus()}
async function load(){
  try{data=await api('GET')}catch(e){if(e)alert('加载失败，请稍后再试');return}
  sessionStorage.setItem('cslb-admin',pw);$('#login').hidden=true;$('#app').hidden=false;render();
}
const PAPER={law:'法律与商务',b:'B 类专业',all:'两门混合','':'未知'};
const DEV={mobile:'手机',desktop:'电脑',tablet:'平板','':'未知'};
const REF=k=>k===''?'直接访问 / 书签':k==='internal'?'站内跳转':k;
const REG=k=>{if(!k)return '未知';const [c,r]=k.split('-');const C={US:'美国',CN:'中国',CA:'加拿大',MX:'墨西哥',TW:'台湾',HK:'香港'}[c]||c;return r?`${C} · ${r}`:C};
let tab=sessionStorage.getItem('cslb-admin-tab')||'traffic';
function kv(title,rows,fmt){const tot=rows.reduce((a,r)=>a+r.n,0)||1;
  return `<div><h3>${title}</h3>${rows.length?`<table class="kv">${rows.map(r=>`<tr><td>${esc(fmt?fmt(r.k):r.k)}<div class="bar" style="width:${r.n/tot*100}%"></div></td><td class="n">${r.n}</td></tr>`).join('')}</table>`:'<p class="small">还没有数据</p>'}</div>`}
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;sessionStorage.setItem('cslb-admin-tab',tab);render()}});
  $('#traffic').hidden=tab!=='traffic';$('#fb').hidden=tab!=='fb';
  const pending=data.feedback.filter(f=>f.status==='new').length;$('#fbcount').textContent=pending||'';
  const v=data.visitors;
  $('#cards').innerHTML=[['今天',data.today,v.today],['最近 7 天',data.week,v.week],['最近 30 天',data.month,v.month],['累计',data.total,v.total]].map(([k,n,u])=>`<div class="card"><span>${k}</span><b>${n}</b><small>浏览 · 访客 ${u}</small></div>`).join('');
  const byDay=Object.fromEntries(data.days.map(d=>[d.day,d])),slots=[];
  const today=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'}));
  for(let k=29;k>=0;k--){const d=new Date(today);d.setDate(d.getDate()-k);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const o=byDay[key]||{n:0,v:0};slots.push([key,o.n,o.v||0])}
  const max=Math.max(1,...slots.map(s=>s[1]));
  $('#chart').innerHTML=slots.map(([d,n,u])=>`<i class="${n?'':'z'}" style="height:${n/max*100}%" data-t="${d.slice(5)}：浏览 ${n} · 访客 ${u}">${n&&u?`<b style="bottom:${u/n*100}%"></b>`:''}</i>`).join('');
  $('#axis').innerHTML=`<span>${slots[0][0].slice(5)}</span><span>今天</span>`;
  const hrs=Array.from({length:24},(_,h)=>({k:`${String(h).padStart(2,'0')}:00`,n:(data.hours.find(x=>x.h===h)||{n:0}).n})).filter(r=>r.n);
  $('#tables').innerHTML=[
    kv('来源网站',data.refs,REF),kv('地区',data.regions,REG),kv('设备',data.devices,k=>DEV[k]||k),
    kv('网站语言',data.langs,k=>LANG[k]||'未知'),kv('页面（最近 30 天）',data.pages,k=>PG[k]||k),kv('页面（累计）',data.allPages,k=>PG[k]||k),
    kv('访问时段（中部时间）',hrs),
    `<div><h3>模拟考试交卷</h3>${data.exams.length?`<table class="kv"><tr><td class="small">试卷</td><td class="n small">次数</td><td class="n small">平均分</td><td class="n small">通过率</td></tr>${data.exams.map(e=>`<tr><td>${PAPER[e.paper]||e.paper}</td><td class="n">${e.n}</td><td class="n">${e.avg}%</td><td class="n">${e.pass}%</td></tr>`).join('')}</table><p class="small">通过线按 72% 计。</p>`:'<p class="small">还没有人交卷</p>'}</div>`
  ].join('');
  const cnt=s=>data.feedback.filter(f=>s==='all'||f.status===s).length;
  $('#filters').innerHTML=[['new','待处理'],['done','已处理'],['ignored','忽略'],['all','全部']].map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${n} <small>${cnt(k)}</small></button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  const list=data.feedback.filter(f=>filter==='all'||f.status===filter);
  $('#list').innerHTML=list.length?list.map(f=>{const q=f.qid&&Q[f.qid];
    return `<div class="item ${f.status!=='new'?'done':''}" data-id="${f.id}">
      <div class="top"><span class="badge ${f.kind==='question'?'q':''}">${KIND[f.kind]||f.kind}</span><span>${new Date(f.created_at).toLocaleString('zh-CN',{timeZone:'America/Chicago'})}</span><span>${LANG[f.lang]||''}</span><span>${esc(f.page||'')}</span><span>${ST[f.status]}</span></div>
      ${f.qid?`<div class="qref"><b>${esc(f.qid)}</b> ${q?`${esc(q.q)}<br>正确答案：${esc(q.o[q.a][0])}（${esc(q.o[q.a][1])}）<br>出处：<a href="${esc(q.s[1])}" target="_blank" rel="noopener">${esc(q.s[0])}</a>`:'（题号不存在）'}</div>`:''}
      <p class="msg">${esc(f.message)}</p>
      ${f.contact?`<p class="small">联系方式：${esc(f.contact)}</p>`:''}
      <textarea rows="2" placeholder="处理备注（只有后台能看到）">${esc(f.note||'')}</textarea>
      <div class="acts">${f.status!=='done'?'<button class="btn pri" data-s="done">标记已处理</button>':''}${f.status!=='ignored'?'<button class="btn" data-s="ignored">忽略</button>':''}${f.status!=='new'?'<button class="btn" data-s="new">恢复待处理</button>':''}<button class="btn" data-s="save">保存备注</button><button class="btn" data-s="delete">删除</button></div></div>`}).join(''):'<p class="small">没有意见。</p>';
  document.querySelectorAll('.item [data-s]').forEach(b=>b.onclick=async()=>{
    const it=b.closest('.item'),id=+it.dataset.id,f=data.feedback.find(x=>x.id===id),note=it.querySelector('textarea').value,s=b.dataset.s;
    if(s==='delete'){if(!confirm('删除这条意见？删除后无法恢复。'))return;await api('POST',{action:'delete',id});data.feedback=data.feedback.filter(x=>x.id!==id)}
    else{const status=s==='save'?f.status:s;await api('POST',{action:'status',id,status,note});f.status=status;f.note=note}
    render();
  });
}
$('#login').onsubmit=e=>{e.preventDefault();pw=$('#pw').value;load()};
$('#logout').onclick=()=>{sessionStorage.removeItem('cslb-admin');pw='';showLogin()};
$('#reload').onclick=load;
pw?load():showLogin();
</script>
</body>
</html>
