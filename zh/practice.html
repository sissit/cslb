<script>
{
const {store,shuffle,wrongSet,practice,bindZh,EN,ES}=window.CSLB,Q=window.QUESTIONS,T=EN?window.TOPICS_EN:ES?window.TOPICS_ES:window.TOPICS;
const W=ES?{law:'Leyes y Negocios',b:'Construcción General',all:'Todas',wrong:'Lista de repaso',allsec:'Todas las secciones',emptyW:'Su lista de repaso está vacía. Las preguntas que falle en la práctica o en los exámenes de prueba se agregan aquí y se quitan cuando las conteste bien.',empty:'Todavía no hay preguntas en esta sección.'}:EN?{law:'Law & Business',b:'General Building',all:'All',wrong:'Review list',allsec:'All sections',emptyW:'Your review list is empty. Questions you miss in practice or mock exams are added here and removed once you answer them correctly.',empty:'No questions in this section yet.'}
 :{law:'法律与商务',b:'B 类专业',all:'全部',wrong:'错题本',allsec:'全部部分',emptyW:'错题本是空的。做题或模拟考试时答错的题会自动加进来，答对后会移出。',empty:'这个部分还没有题目。'};
let ex=store.get('p-ex','law'),tp=store.get('p-tp','all');
if(location.hash==='#wrong'){ex='wrong';tp='all'}
if(tp!=='all'&&!(T[ex]||{})[tp])tp='all';
const app=document.getElementById('app');
function count(x,t){return Q.filter(q=>(x==='all'||q.x===x)&&(t==='all'||q.t===t)).length}
function draw(){
  const w=wrongSet();
  const E=[['law',W.law],['b',W.b],['all',W.all],['wrong',W.wrong]];
  document.getElementById('exams').innerHTML=E.map(([k,n])=>`<button class="chip" data-e="${k}" aria-pressed="${ex===k}">${n}<small>${k==='wrong'?w.size:count(k,'all')}</small></button>`).join('');
  const sub=ex==='law'||ex==='b';
  document.getElementById('topics').innerHTML=[['all',W.allsec],...(sub?Object.entries(T[ex]):[])].map(([k,n])=>`<button class="chip" data-t="${k}" aria-pressed="${tp===k}">${n}${sub?`<small>${count(ex,k)}</small>`:''}</button>`).join('');
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ex=b.dataset.e;tp='all';if(ex!=='wrong')store.set('p-ex',ex);history.replaceState(null,'',ex==='wrong'?'#wrong':location.pathname);draw();run()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tp=b.dataset.t;store.set('p-tp',tp);draw();run()});
}
function run(){
  const w=wrongSet();
  let list=Q.filter(q=>ex==='wrong'?w.has(q.id):(ex==='all'||q.x===ex)&&(tp==='all'||q.t===tp));
  if(document.getElementById('shuf').checked)list=shuffle(list);
  practice(app,list,`<div class="empty">${ex==='wrong'?W.emptyW:W.empty}</div>`);
}
document.getElementById('shuf').onchange=run;
bindZh();draw();run();
}
</script>
