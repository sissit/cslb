<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>章节练习 · CSLB 备考</title>
<meta name="description" content="按 CSLB 考试大纲分章节练习：法律与商务、B 类总包，中英对照，当场解析，错题本。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header id="top" class="top"></header>
<main class="wrap narrow band">
  <h1>章节练习</h1>
  <p class="lead">选一门考试和一个部分开始练。每题当场出答案和解析，答错的题会存进本机的错题本。</p>
  <div class="label">考试</div>
  <div class="chips" id="exams"></div>
  <div class="label">部分</div>
  <div class="chips" id="topics"></div>
  <div class="row"><label class="chk"><input type="checkbox" data-zh>中文对照</label><label class="chk"><input type="checkbox" id="shuf">打乱顺序</label></div>
  <div class="prog"><i id="pg" style="width:0"></i></div>
  <section id="app" aria-live="polite"></section>
</main>
<footer id="foot" class="foot"></footer>
<script src="content/questions.js"></script>
<script src="assets/app.js"></script>
<script>
{
const {store,shuffle,wrongSet,practice,bindZh}=window.CSLB,Q=window.QUESTIONS,T=window.TOPICS;
let ex=store.get('p-ex','law'),tp=store.get('p-tp','all');
if(location.hash==='#wrong'){ex='wrong';tp='all'}
if(tp!=='all'&&!(T[ex]||{})[tp])tp='all';
const app=document.getElementById('app');
function count(x,t){return Q.filter(q=>(x==='all'||q.x===x)&&(t==='all'||q.t===t)).length}
function draw(){
  const w=wrongSet();
  const E=[['law','法律与商务'],['b','B 类专业'],['all','全部'],['wrong','错题本']];
  document.getElementById('exams').innerHTML=E.map(([k,n])=>`<button class="chip" data-e="${k}" aria-pressed="${ex===k}">${n}<small>${k==='wrong'?w.size:count(k,'all')}</small></button>`).join('');
  const tops=ex==='law'||ex==='b'?Object.entries(T[ex]):[];
  document.getElementById('topics').innerHTML=[['all','全部部分'],...tops].map(([k,n])=>`<button class="chip" data-t="${k}" aria-pressed="${tp===k}">${n}${ex==='law'||ex==='b'?`<small>${count(ex,k)}</small>`:''}</button>`).join('');
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ex=b.dataset.e;tp='all';store.set('p-ex',ex==='wrong'?'law':ex);history.replaceState(null,'',ex==='wrong'?'#wrong':location.pathname);draw();run()});
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tp=b.dataset.t;store.set('p-tp',tp);draw();run()});
}
function run(){
  const w=wrongSet();
  let list=Q.filter(q=>ex==='wrong'?w.has(q.id):(ex==='all'||q.x===ex)&&(tp==='all'||q.t===tp));
  if(document.getElementById('shuf').checked)list=shuffle(list);
  practice(app,list,`<div class="empty">${ex==='wrong'?'错题本是空的。做题或模拟考试时答错的题会自动加进来，答对后会移出。':'这个部分还没有题目。'}</div>`);
}
document.getElementById('shuf').onchange=run;
bindZh();draw();run();
}
</script>
</body>
</html>
